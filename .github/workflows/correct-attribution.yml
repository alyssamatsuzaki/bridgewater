name: Correct commit attribution

on:
  push:
    branches:
      - claude/epic-keller-qyngn2
    paths:
      - .github/workflows/correct-attribution.yml

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: claude/epic-keller-qyngn2

      - name: Rewrite Claude attribution
        env:
          FILTER_BRANCH_SQUELCH_WARNING: "1"
          EXPECTED_FINAL_TREE: "26eb6326943dc9de860f6b98e96040834577b11a"
          TARGET_BRANCH: "claude/epic-keller-qyngn2"
        shell: bash
        run: |
          git filter-branch -f --env-filter '
          if [ "$GIT_AUTHOR_EMAIL" = "noreply@anthropic.com" ]; then
            export GIT_AUTHOR_NAME="alyssamatsuzaki"
            export GIT_AUTHOR_EMAIL="57046491+alyssamatsuzaki@users.noreply.github.com"
          fi
          if [ "$GIT_COMMITTER_EMAIL" = "noreply@anthropic.com" ]; then
            export GIT_COMMITTER_NAME="alyssamatsuzaki"
            export GIT_COMMITTER_EMAIL="57046491+alyssamatsuzaki@users.noreply.github.com"
          fi
          ' -- HEAD

          git config user.name "alyssamatsuzaki"
          git config user.email "57046491+alyssamatsuzaki@users.noreply.github.com"
          git rm .github/workflows/correct-attribution.yml
          git commit -m "Remove temporary attribution workflow"

          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_FINAL_TREE"
          test "$(git log --format='%ae%n%ce' | grep -c '^noreply@anthropic\.com$' || true)" = "0"

          git push --force-with-lease=refs/heads/$TARGET_BRANCH:$GITHUB_SHA origin HEAD:refs/heads/$TARGET_BRANCH
